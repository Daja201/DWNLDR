<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="wrap">

  <section class="panel">
    <div class="row">
      <input id="url" type="text" placeholder="YouTube, Spotify or image URL">
    </div>
    <div class="row">
      <select id="mode">
        <option value="audio">Audio</option>
        <option value="video">Video</option>
      </select>
      <button id="folderBtn" type="button">Folder: <span id="folderLabel">{{ default_folder or '/' }}</span></button>
      <button id="addBtn" type="button">Add</button>
    </div>
  </section>

  <section class="panel">
    <h2>Queue</h2>
    <div id="queue" class="list"></div>
  </section>

  <section class="panel">
    <h2>History</h2>
    <div id="history" class="list"></div>
  </section>

  <section class="panel">
    <h2>Log</h2>
    <div id="log" class="log"></div>
  </section>

</div>

<div id="folderModal" class="modal hidden">
  <div class="modal-box">
    <div class="row">
      <button id="folderUp" type="button">Up</button>
      <span id="folderPath">/</span>
    </div>
    <div id="folderList" class="list"></div>
    <div class="row">
      <input id="newFolderName" type="text" placeholder="new folder name">
      <button id="mkdirBtn" type="button">Create</button>
    </div>
    <div class="row">
      <button id="folderUse" type="button">Use this folder</button>
      <button id="folderClose" type="button">Close</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
  window.DOWNLOAD_BASE = {{ download_base|tojson }};
  window.DEFAULT_FOLDER = {{ default_folder|tojson }};
</script>
<script src="/static/app.js"></script>
</body>
</html>
